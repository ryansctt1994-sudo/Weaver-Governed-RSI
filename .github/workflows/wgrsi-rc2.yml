name: WGRSI RC2 isolation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Strict RC2 tests
        run: pytest validation/integration/test_wgrsi_rc2.py validation/integration/test_wgrsi_rc1.py -q
      - name: Static analysis
        run: |
          ruff check experiments validation/integration/test_wgrsi_rc1.py validation/integration/test_wgrsi_rc2.py
          mypy experiments --strict
      - name: Run isolated evaluator trust-domain proof
        run: sudo -E "$(command -v python)" -m experiments.run_wgrsi_rc2_isolation
