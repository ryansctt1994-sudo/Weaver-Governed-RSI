name: WGRSI RC3 internalization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-internalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run deterministic RC3 experiment
        run: python -m experiments.run_wgrsi_rc3
      - name: Run RC1-RC3 integration tests
        run: >-
          pytest
          validation/integration/test_wgrsi_rc1.py
          validation/integration/test_wgrsi_rc2.py
          validation/integration/test_wgrsi_rc3.py
          -q
      - name: Static analysis
        run: |
          ruff check experiments validation/integration/test_wgrsi_rc1.py validation/integration/test_wgrsi_rc2.py validation/integration/test_wgrsi_rc3.py
          mypy experiments --strict
