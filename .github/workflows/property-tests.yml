name: Property and State-Machine Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-4-property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: pytest validation/properties/test_authority_properties.py

  ci-6-state-machine-enumeration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: pytest validation/properties/test_state_machine.py
