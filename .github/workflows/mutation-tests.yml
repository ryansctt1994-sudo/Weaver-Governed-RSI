name: Mutation Tests

on:
  pull_request:
    paths:
      - "kernel/**"
      - "validation/evidence_registry.py"
      - "validation/**/test_*.py"
      - "tests/**/test_*.py"
      - "pyproject.toml"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-9-mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: mutmut run
      - run: mutmut results
      - run: >-
          python validation/mutation/check_mutation_score.py
          --mutants-root mutants
          --minimum-score 75
