name: RC3 candidate receipt-intake regression (review only)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strict-replication-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install candidate's hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Static lint and format checks
        run: |
          ruff check replication/verify_replication.py validation/unit/test_replication_json_boundary.py
          ruff format --check replication/verify_replication.py validation/unit/test_replication_json_boundary.py
      - name: Verify signed positive and ambiguous-JSON negative controls
        run: python -m pytest -q validation/unit/test_replication_json_boundary.py
