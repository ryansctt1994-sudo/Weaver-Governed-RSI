name: Bug report
description: Report reproducible incorrect behavior that is not security-sensitive.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: input
    id: commit
    attributes:
      label: Commit or release
      description: Exact commit SHA or immutable release tag.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include exact commands and sanitized inputs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
