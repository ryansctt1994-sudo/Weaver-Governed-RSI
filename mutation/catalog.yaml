    severity: critical
    invariants: [I7]
    expected_suites:
      - validation/adversarial/test_toctou_object_identity.py
    expected_tests: [CRT-K1, CRT-K6, CRT-K10, CRT-K11]
    detection_mode: junit_failure
    patch: mutants/M01_remove_identity_revalidation.patch
    expected_changed_paths: [governance/mutation_transaction.py]

  M02:
    title: indeterminate identity becomes equivalent
    severity: critical
    invariants: [I0, I7]
    expected_suites: [validation/adversarial/test_toctou_object_identity.py]
    expected_tests: [incomplete_identity, CRT-K11]
    detection_mode: junit_failure
    patch: mutants/M02_indeterminate_as_equivalent.patch

  M03:
