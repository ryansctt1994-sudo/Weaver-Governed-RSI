schema_version: "weaver.mutation.catalog.v1"

controls:
  M00:
    title: no mutation baseline
    description: Run required adversarial suites without applying a mutation.
    severity: control
    expected_status: CONTROL_PASS
    patch: null
    detection_mode: junit_failure
    expected_suites:
      - validation/adversarial/test_toctou_object_identity.py
      - validation/adversarial/test_authority_composition.py
    expected_tests: []
    expected_changed_paths: []

  MCTL-1:
    title: catastrophic identity equivalence collapse
    description: Force every Linux object-identity comparison to EQUIVALENT.
    severity: control
    invariants: [I7, I0]
    expected_suites:
      - validation/adversarial/test_toctou_object_identity.py
    expected_tests: [CRT-K1, CRT-K2, CRT-K6, CRT-K10, CRT-K11]
    expected_status: KILLED
    detection_mode: junit_failure
    patch: mutants/MCTL-1_force_equivalent.patch
    expected_changed_paths: [identity/policy.py]

mutants:
