[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-governed-rsi"
version = "0.1.0"
description = "Research prototype for governed recursive self-improvement validation."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["validation"]
markers = [
  "linux: Linux-specific filesystem test",
  "slow: longer-running adversarial test",
]
